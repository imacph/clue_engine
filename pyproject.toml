[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clue-engine"
dynamic = ["version"]
description = "A Clue game simulator for reinforcement learning"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0,<7",
]
desktop-build = [
    "pywebview>=5.0,<7",
    "pyinstaller>=6.0,<7",
]
dev = [
    "build",
    "hatchling",
    "pytest",
    "ruff",
]

[tool.hatch.version]
path = "src/clue_engine/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]