[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clue-engine"
version = "0.1.0"
description = "A Clue game simulator for reinforcement learning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]